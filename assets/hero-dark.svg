    <text x="78" y="64" class="font-mono" font-size="13" fill="#8A8F98">Shipping in production — Nigeria</text>

    <text x="56" y="124" class="font-display" font-size="44" font-weight="700" letter-spacing="-0.025em" fill="#E8E6E1">Inioluwa Daniel Osibajo</text>

    <text x="56" y="162" class="font-sans" font-size="18.5" font-weight="600" fill="#E6C766">Software Engineer at PicckR  |  Founder of Sojourner Builds</text>

    <text x="56" y="202" class="font-sans" font-size="15.5" fill="#8A8F98">I ship real products, architect resilient web systems,</text>
    <text x="56" y="226" class="font-sans" font-size="15.5" fill="#8A8F98">and write about how I build them.</text>

    <text x="56" y="276" class="font-mono" font-size="12" fill="#8A8F98" opacity="0.88">Waypoints: Lagos 6.52°N  /  Kaduna 10.51°N  /  Cross River 5.87°N</text>
  </g>

